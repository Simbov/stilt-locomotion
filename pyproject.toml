[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stilt-locomotion"
version = "0.1.0"
description = "Stilt locomotion research using mjlab / MuJoCo-Warp"
requires-python = ">=3.10"
dependencies = [
    "mjlab==1.5.3",
    # mujoco / mujoco-warp are pinned to 3.10 by mjlab 1.5 (clean PyPI pins);
    # no project-level pin needed. The old `mujoco<3.8` pin dodged the 3.8.0
    # memory leak — 1.5 jumps to 3.10, so re-verify memory on the next run.
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stilt*"]

[dependency-groups]
dev = [
    "fast-simplification>=0.1.13",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
# Mirrors mjlab/pyproject.toml so project code matches the submodule's style.
indent-width = 2
exclude = ["mjlab", "logs", "wandb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.pytest.ini_options]
# Repo root on sys.path so tests can import the `envs` and `scripts` packages,
# which are workspace code rather than installed distributions.
pythonpath = ["."]
testpaths = ["tests"]

